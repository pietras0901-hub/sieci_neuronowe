<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Klasyfikator Owoców 🍎🍌</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap');

    :root {
      --apple: #e63946;
      --banana: #f4c430;
      --dark: #1a1a2e;
      --card: #16213e;
      --text: #eaeaea;
      --muted: #8888aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.8rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 0.3rem;
      letter-spacing: -1px;
    }

    .subtitle {
      color: var(--muted);
      text-align: center;
      font-size: 0.85rem;
      margin-bottom: 2.5rem;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .field {
      margin-bottom: 1.8rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.8rem;
    }

    .toggle {
      display: flex;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .toggle button {
      flex: 1;
      padding: 0.9rem;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle button.active-red {
      background: var(--apple);
      color: white;
      font-weight: 700;
    }

    .toggle button.active-yellow {
      background: var(--banana);
      color: #1a1a2e;
      font-weight: 700;
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--apple);
      height: 6px;
      cursor: pointer;
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }

    .weight-display {
      text-align: center;
      font-size: 2rem;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      margin-top: 0.5rem;
      color: var(--text);
    }

    .weight-display span {
      font-size: 1rem;
      color: var(--muted);
    }

    button.predict-btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--apple), #c1121f);
      color: white;
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 1px;
      margin-top: 0.5rem;
    }

    button.predict-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(230, 57, 70, 0.4);
    }

    button.predict-btn:active {
      transform: translateY(0);
    }

    .result {
      margin-top: 2rem;
      text-align: center;
      padding: 1.5rem;
      border-radius: 14px;
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      display: none;
      animation: pop 0.3s ease;
    }

    .result.apple {
      background: rgba(230, 57, 70, 0.15);
      border: 2px solid var(--apple);
      color: var(--apple);
    }

    .result.banana {
      background: rgba(244, 196, 48, 0.15);
      border: 2px solid var(--banana);
      color: var(--banana);
    }

    .result .emoji {
      font-size: 3rem;
      display: block;
      margin-bottom: 0.3rem;
    }

    .status {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 1.5rem;
    }

    .status.ok { color: #4caf50; }
    .status.err { color: var(--apple); }

    @keyframes pop {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>🍎 vs 🍌</h1>
  <p class="subtitle">Klasyfikator owoców — sieć neuronowa w przeglądarce</p>

  <div class="card">

    <!-- Kolor -->
    <div class="field">
      <label>Kolor owocu</label>
      <div class="toggle">
        <button id="btn-red" class="active-red" onclick="setColor(1)">🔴 Czerwony</button>
        <button id="btn-yellow" onclick="setColor(0)">🟡 Żółty</button>
      </div>
    </div>

    <!-- Waga -->
    <div class="field">
      <label>Waga owocu</label>
      <input type="range" id="weight" min="80" max="280" value="180"
             oninput="document.getElementById('wval').textContent = this.value">
      <div class="range-labels"><span>80g</span><span>280g</span></div>
      <div class="weight-display" id="wval">180 <span>g</span></div>
    </div>

    <button class="predict-btn" onclick="predict()">▶ Klasyfikuj owoc</button>

    <div class="result" id="result">
      <span class="emoji" id="emoji"></span>
      <span id="label"></span>
    </div>

    <p class="status" id="status">⏳ Ładowanie modelu...</p>
  </div>

  <script>
    let model = null;
    let colorVal = 1;

    async function loadModel() {
      try {
        model = await tf.loadLayersModel('model/model.json');
        document.getElementById('status').textContent = '✅ Model załadowany — gotowy!';
        document.getElementById('status').className = 'status ok';
      } catch (e) {
        document.getElementById('status').textContent = '❌ Błąd ładowania modelu. Sprawdź folder model/';
        document.getElementById('status').className = 'status err';
      }
    }

    function setColor(val) {
      colorVal = val;
      document.getElementById('btn-red').className    = val === 1 ? 'active-red' : '';
      document.getElementById('btn-yellow').className = val === 0 ? 'active-yellow' : '';
    }

    async function predict() {
      if (!model) {
        alert('Model jeszcze się ładuje, poczekaj chwilę!');
        return;
      }
      const weight = parseFloat(document.getElementById('weight').value);
      const input  = tf.tensor2d([[colorVal, weight]]);
      const pred   = model.predict(input);
      const val    = (await pred.data())[0];

      const resultEl = document.getElementById('result');
      const emoji    = document.getElementById('emoji');
      const labelEl  = document.getElementById('label');

      if (val < 0.5) {
        resultEl.className = 'result apple';
        emoji.textContent  = '🍎';
        labelEl.textContent = 'To jabłko!';
      } else {
        resultEl.className = 'result banana';
        emoji.textContent  = '🍌';
        labelEl.textContent = 'To banan!';
      }
      resultEl.style.display = 'block';
    }

    loadModel();
  </script>
</body>
</html>
